# front CI: PR과 main push마다 검사·빌드만 한다. 운영 서버에는 접근하지 않는다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      # package.json의 packageManager(pnpm@11.25.0)를 그대로 사용한다.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Workspace check
        run: pnpm check
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
        # 2026-11-16 기준 기존 오류(react-hooks/set-state-in-effect 16개)를 정리하기 전까지는 결과만 표시한다.
        continue-on-error: true
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
